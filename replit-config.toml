# Correct .replit configuration for C++ Mersenne Prime Calculator
modules = ["cpp", "nix"]

[nix]
channel = "stable-24_05"

# Essential: This is what fixes "Could not find run command"
run = "./deploy-and-run.sh"

# Hidden files that should be shown
hidden = [".config", "tsconfig.json", "package-lock.json"]

# Entrypoint for the application
entrypoint = "deploy-and-run.sh"

[gitHubImport]
requiredFiles = [".replit", "replit.nix"]

[deployment]
deploymentTarget = "cloudrun"
# Build command runs before deployment
build = ["make", "clean", "&&", "make", "all"]
# Run command for the deployed application
run = ["./bin/mersenne_prime", "-p", "127", "-v"]

# Port configuration for web access
[[ports]]
localPort = 5000
externalPort = 80
exposeLocalhost = true

# Language server configuration
[languages]

[languages.cpp]
pattern = "**/*.{cpp,hpp,c,h,cc,cxx}"
syntax = "cpp"

[languages.cpp.languageServer]
start = "clangd"

# Environment variables
[env]
CC = "gcc"
CXX = "g++"
MAKEFLAGS = "-j$(nproc)"